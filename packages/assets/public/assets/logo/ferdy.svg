<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- 로고 그룹 -->
  <g>
    <!-- 1. 좌측 반원 링 (포레스트 그린) -->
    <!-- 중심 (100, 100), 외경 80, 내경 42 / 상단 경계 시계방향 30도 이동, 하단 경계 x = 58 -->
    <path d="M 140 30.72 
             A 80 80 0 0 0 58 168.09 
             L 58 100 
             A 42 42 0 0 1 121 63.63 
             Z" fill="#3b6e52" />

    <!-- 2. 우상단 부채꼴 링 (빈티지 오렌지 브라운) -->
    <!-- 상단 경계 시계방향 30도 이동, 하단 여백 라인 y = 126 -->
    <path d="M 140 30.72 
             A 80 80 0 0 1 175.66 126 
             L 132.98 126 
             A 42 42 0 0 0 121 63.63 
             Z" fill="#d97736" />

    <!-- 3. 중앙 코어 원 (빈티지 오렌지 브라운) -->
    <circle cx="100" cy="100" r="26" fill="#d97736" />

    <!-- 4. 우하단 사선 분할 쐐기 - 상단 (빈티지 오렌지 브라운) -->
    <!-- 좌측 세로선 x = 75, 상단 가로선 y = 139 -->
    <path d="M 75 139 
             L 169.85 139 
             L 75 175.99 
             Z" fill="#d97736" />

    <!-- 5. 우하단 사선 분할 쐐기 - 하단 외곽 호 (포레스트 그린) -->
    <path d="M 169.85 139 
             A 80 80 0 0 1 75 175.99 
             Z" fill="#3b6e52" />
  </g>
</svg>